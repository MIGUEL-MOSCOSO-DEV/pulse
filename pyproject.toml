[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-monitor"
version = "1.0.0"
description = "A native Windows resource monitor with history, threshold alerts and a system tray."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Miguel Moscoso", email = "miguelmoscoso.devperu@gmail.com"}]
dependencies = ["psutil==7.2.2","pystray==0.19.5","pillow==13.0.0"]

[project.scripts]
pulse = "pulse.app:main"

[project.urls]
Repository = "https://github.com/MIGUEL-MOSCOSO-DEV/pulse"
Issues = "https://github.com/MIGUEL-MOSCOSO-DEV/pulse/issues"

[tool.setuptools.packages.find]
include = ["pulse*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
